<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700"><rect width="100%" height="100%" fill="white"/><text x="450" y="35" font-family="Arial" font-size="23" text-anchor="middle" fill="#17365d">Proceso crítico: operación offline y sincronización</text><g font-family="Arial" font-size="16" text-anchor="middle" stroke="#315b86" stroke-width="2" fill="#eef5ff"><rect x="300" y="65" width="300" height="55" rx="12"/><rect x="300" y="155" width="300" height="60" rx="12" fill="#fff2cc"/><rect x="45" y="275" width="320" height="75" rx="12"/><rect x="535" y="275" width="320" height="75" rx="12"/><rect x="535" y="395" width="320" height="60" rx="12"/><rect x="535" y="495" width="320" height="60" rx="12"/><rect x="535" y="595" width="320" height="60" rx="12" fill="#d9f2e6"/></g><g font-family="Arial" font-size="16" text-anchor="middle" fill="#17365d"><text x="450" y="99">Registrar movimiento</text><text x="450" y="190">¿Hay conexión?</text><text x="205" y="305">Sí: validar y guardar</text><text x="205" y="328">en servidor</text><text x="695" y="303">No: guardar localmente</text><text x="695" y="327">con ID único y pendiente</text><text x="695" y="420">Al reconectar, enviar pendientes</text><text x="695" y="520">Validar integridad y evitar duplicados</text><text x="695" y="620">Confirmar y marcar sincronizada</text></g><g stroke="#315b86" stroke-width="2.5" fill="none"><path d="M450 120 V155"/><path d="M300 185 H205 V275"/><path d="M600 185 H695 V275"/><path d="M695 350 V395"/><path d="M695 455 V495"/><path d="M695 555 V595"/></g><g font-family="Arial" font-size="14" fill="#333"><text x="245" y="176">Sí</text><text x="635" y="176">No</text></g><text x="450" y="680" font-family="Arial" font-size="13" text-anchor="middle" fill="#555">RNF-04: sincronizar en 15 minutos sin pérdida ni duplicación.</text></svg>